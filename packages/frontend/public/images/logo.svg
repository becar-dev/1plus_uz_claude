<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80">
  <!-- 1PLUS / BIR+ Brand Logo -->
  <!-- Stylized "1" made of overlapping CMYK colors with white "+" -->
  
  <!-- The "1" shape - composed of overlapping color layers -->
  <!-- Yellow layer (back) -->
  <polygon points="28,12 42,12 42,62 28,62" fill="#FFF200" opacity="0.9"/>
  
  <!-- Cyan layer (overlapping left) -->
  <polygon points="18,18 36,8 36,58 18,58" fill="#00AEEF" opacity="0.85"/>
  
  <!-- Magenta layer (overlapping right) -->
  <polygon points="32,14 48,10 48,60 32,60" fill="#EC008C" opacity="0.8"/>
  
  <!-- Overlap blend areas for the "1" -->
  <!-- Cyan + Yellow overlap = greenish area -->
  <polygon points="28,18 36,12 36,58 28,58" fill="#00AEEF" opacity="0.4"/>
  
  <!-- Magenta + Yellow overlap -->
  <polygon points="32,14 42,12 42,60 32,60" fill="#EC008C" opacity="0.35"/>
  
  <!-- White "+" cross symbol in upper portion of the "1" -->
  <rect x="29" y="22" width="10" height="2.5" rx="0.5" fill="#FFFFFF"/>
  <rect x="32.5" y="18.5" width="2.5" height="10" rx="0.5" fill="#FFFFFF"/>
  
  <!-- Four CMYK dots below the "1" -->
  <circle cx="22" cy="70" r="3.5" fill="#00AEEF"/>
  <circle cx="31" cy="70" r="3.5" fill="#EC008C"/>
  <circle cx="40" cy="70" r="3.5" fill="#FFF200"/>
  <circle cx="49" cy="70" r="3.5" fill="none" stroke="#333333" stroke-width="1.2"/>
  
  <!-- "BIR+" text to the right -->
  <text x="68" y="50" font-family="Inter, Arial, Helvetica, sans-serif" font-weight="800" font-size="36" fill="currentColor" letter-spacing="-1">BIR</text>
  <!-- The "+" with magenta accent -->
  <text x="155" y="50" font-family="Inter, Arial, Helvetica, sans-serif" font-weight="800" font-size="36" fill="#EC008C">+</text>
</svg>
